[package]
name = "interrupt-input-demo"
version = "0.1.0"
authors = ["Ryan Riley <rriley.cs@gmail.com>"]
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["device"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rp2040-boot2 = "0.3.0"

[profile.release]
debug = 2
